name: Aurelia Windows Installer Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          } else {
            pip install pyinstaller
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          if (Test-Path installer/aurelia.spec) {
            pyinstaller --clean --noconfirm installer/aurelia.spec
          } else {
            Write-Host "Warning: aurelia.spec not found, skipping PyInstaller build"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: pwsh
        run: |
          $iscc = $null
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $iscc = $command.Source }
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:ChocolateyInstall\bin\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc '.\installer\Aurelia_Installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup returned exit code $LASTEXITCODE" }

      - name: Sign Setup (optional)
        shell: pwsh
        if: secrets.WINDOWS_SIGNING_CERT_BASE64 != ''
        run: |
          $certBase64 = $env:WINDOWS_SIGNING_CERT_BASE64
          $certPassword = $env:WINDOWS_SIGNING_CERT_PASSWORD
          $certFile = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'cert.pfx')
          
          [System.Convert]::FromBase64String($certBase64) | Set-Content -Path $certFile -AsByteStream
          
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            Write-Host "signtool.exe not found, skipping code signing"
            return
          }
          
          $setupExe = Get-ChildItem -Path .\installer\output -Filter "Aurelia_Setup*.exe" | Select-Object -First 1
          if ($setupExe) {
            & signtool.exe sign /f $certFile /p $certPassword /t http://timestamp.comodoca.com /fd SHA256 $setupExe.FullName
          }
          
          Remove-Item -Path $certFile -Force
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}

      - name: Create Release
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $setupExe = Get-ChildItem -Path .\installer\output -Filter "Aurelia_Setup*.exe" | Select-Object -First 1
          if ($setupExe) {
            Write-Host "Setup ready for release: $($setupExe.Name)"
          } else {
            Write-Host "No setup exe found for release"
          }

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aurelia-Windows-Setup
          path: installer/output/*.exe
          if-no-files-found: warn
