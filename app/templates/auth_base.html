<!doctype html>
<html lang="fr" data-theme="aurelia-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#f8fafc"><title>{% block title %}Aurélia{% endblock %}</title><link rel="icon" type="image/svg+xml" href="/static/brand/aurelia-symbol.svg"><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-body"><main class="auth-shell {% block shell_class %}{% endblock %}"><section class="auth-panel"><div class="auth-logo"><img class="auth-brand-symbol" src="/static/brand/aurelia-symbol.svg" alt=""><div><span class="brand-name">Aurélia</span><span class="visually-hidden">AURELIA V5</span><span class="brand-version">Gestion documentaire locale</span></div></div><div class="auth-intro">{% block brand_message %}<p>Votre gestion documentaire, en local.</p>{% endblock %}</div>{% block content %}{% endblock %}<p class="local-note"><span class="local-dot"></span>Données conservées sur ce PC</p></section></main></body></html>
